name: Windows estimator

on:
  workflow_dispatch:
  push:
    branches: [feat/estimator-windows]
    paths:
      - 'src/seqattn_core/estimation/**'
      - 'packaging/estimator/**'
      - '.github/workflows/estimator-windows.yml'
  pull_request:
    paths:
      - 'src/seqattn_core/estimation/**'
      - 'packaging/estimator/**'
      - '.github/workflows/estimator-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build tools
        run: python -m pip install pyinstaller==6.19.0
      - name: Build standalone executable
        run: python packaging/estimator/build.py
      - name: Test executable outside the source tree
        run: python packaging/estimator/smoke.py dist/seqattn-estimator/seqattn-estimator.exe
      - uses: actions/upload-artifact@v4
        with:
          name: seqattn-estimator-windows-x64
          path: dist/seqattn-estimator/
          if-no-files-found: error
