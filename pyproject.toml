[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqattn"
version = "0.3.0"
description = "Paged exact attention with bounded HBM and host-memory working sets"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "seqattn contributors"}]
dependencies = ["torch>=2.5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
cuda = ["triton>=3.1"]
benchmark = ["pynvml>=12", "pandas>=2", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
seqattn-bench = "seqattn.benchmarking.streaming:main"
seqattn-bench-resident = "seqattn.benchmarking.resident:main"
seqattn-paged-bench = "seqattn.benchmarking.paged:main"
seqattn-pipeline-bench = "seqattn.benchmarking.projection:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
