[attention]
# auto uses an SM-aware preference order and falls back when an optional
# FlashAttention package is not installed.
backend = "auto"

[minimax_h3]
# QKV projection and complete MLP tile sizes are independent of the resident-Q
# and streamed-K/V chunk sizes exposed by the ComfyUI node.
execution_mode = "materialized"
projection_tile_tokens = 4096
ffn_tile_tokens = 4096

[wan]
# Wan supports both materialized and recompute execution. These tile sizes are
# conservative starting values and require model/hardware-specific calibration.
execution_mode = "materialized"
projection_tile_tokens = 2048
ffn_tile_tokens = 2048

[ltx2]
# LTX2 supports materialized and recompute execution. One projection tile
# applies to all materialized self, text, and audio/video projection runners.
execution_mode = "materialized"
projection_tile_tokens = 2048
video_ffn_tile_tokens = 2048
audio_ffn_tile_tokens = 2048
