<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">seqattn 524K-token HBM workspace benchmark</title>
  <desc id="desc">Execution time reaches a plateau near 50.5 seconds at an 8 GiB HBM workspace while H2D traffic and query passes continue to decline.</desc>

  <rect width="1200" height="680" rx="8" fill="#0b1220"/>

  <text x="48" y="58" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="700">524K-token exact dense attention</text>
  <text x="48" y="90" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="16">BF16 · 56 heads · head dim 128 · 21 GiB Q/K/V · unrestricted caller DRAM</text>

  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="48" y="116" width="220" height="42" rx="8" fill="#132033" stroke="#26364d"/>
    <text x="66" y="143" fill="#cbd5e1" font-size="14">GPU resident baseline</text>
    <text x="247" y="143" text-anchor="end" fill="#34d399" font-size="17" font-weight="700">38.154 s</text>

    <rect x="280" y="116" width="218" height="42" rx="8" fill="#132033" stroke="#26364d"/>
    <text x="298" y="143" fill="#cbd5e1" font-size="14">8 GiB workspace</text>
    <text x="478" y="143" text-anchor="end" fill="#fb923c" font-size="17" font-weight="700">50.490 s</text>

    <rect x="510" y="116" width="292" height="42" rx="8" fill="#132033" stroke="#26364d"/>
    <text x="528" y="143" fill="#cbd5e1" font-size="14">8-16 GiB median spread</text>
    <text x="782" y="143" text-anchor="end" fill="#38bdf8" font-size="17" font-weight="700">0.10%</text>
  </g>

  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="48" y="192" fill="#e2e8f0" font-size="15" font-weight="650">EXECUTION TIME (SECONDS)</text>

    <g stroke="#26364d" stroke-width="1">
      <line x1="92" y1="216" x2="802" y2="216"/>
      <line x1="92" y1="280" x2="802" y2="280"/>
      <line x1="92" y1="344" x2="802" y2="344"/>
      <line x1="92" y1="408" x2="802" y2="408"/>
      <line x1="92" y1="472" x2="802" y2="472"/>
      <line x1="92" y1="504" x2="802" y2="504"/>
    </g>

    <g fill="#64748b" font-size="13" text-anchor="end">
      <text x="78" y="221">56</text>
      <text x="78" y="285">52</text>
      <text x="78" y="349">48</text>
      <text x="78" y="413">44</text>
      <text x="78" y="477">40</text>
      <text x="78" y="509">38</text>
    </g>

    <rect x="316" y="208" width="486" height="296" fill="#38bdf8" opacity="0.035"/>
    <text x="329" y="232" fill="#7dd3fc" font-size="13" font-weight="650">WORKSPACE PLATEAU</text>

    <line x1="92" y1="502" x2="802" y2="502" stroke="#34d399" stroke-width="2" stroke-dasharray="8 7"/>
    <rect x="100" y="477" width="162" height="28" rx="6" fill="#0f2f2a" stroke="#1d594b"/>
    <text x="181" y="496" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="650">GPU resident · 38.154 s</text>

    <g stroke="#38bdf8" stroke-width="2.5">
      <line x1="100" y1="274" x2="100" y2="244"/>
      <line x1="91" y1="274" x2="109" y2="274"/>
      <line x1="91" y1="244" x2="109" y2="244"/>

      <line x1="213" y1="287" x2="213" y2="260"/>
      <line x1="204" y1="287" x2="222" y2="287"/>
      <line x1="204" y1="260" x2="222" y2="260"/>

      <line x1="327" y1="311" x2="327" y2="297"/>
      <line x1="318" y1="311" x2="336" y2="311"/>
      <line x1="318" y1="297" x2="336" y2="297"/>

      <line x1="440" y1="312" x2="440" y2="296"/>
      <line x1="431" y1="312" x2="449" y2="312"/>
      <line x1="431" y1="296" x2="449" y2="296"/>

      <line x1="553" y1="311" x2="553" y2="296"/>
      <line x1="544" y1="311" x2="562" y2="311"/>
      <line x1="544" y1="296" x2="562" y2="296"/>

      <line x1="780" y1="313" x2="780" y2="296"/>
      <line x1="771" y1="313" x2="789" y2="313"/>
      <line x1="771" y1="296" x2="789" y2="296"/>
    </g>

    <polyline points="100,259 213,274 327,304 440,304 553,304 780,304" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fb923c" stroke="#0b1220" stroke-width="3">
      <circle cx="100" cy="259" r="7"/>
      <circle cx="213" cy="274" r="7"/>
      <circle cx="327" cy="304" r="7"/>
      <circle cx="440" cy="304" r="7"/>
      <circle cx="553" cy="304" r="7"/>
      <circle cx="780" cy="304" r="7"/>
    </g>

    <g fill="#f8fafc" font-size="13" font-weight="650" text-anchor="middle">
      <text x="100" y="232">53.31</text>
      <text x="213" y="250">52.40</text>
      <text x="327" y="331">50.49</text>
      <text x="440" y="331">50.52</text>
      <text x="553" y="331">50.50</text>
      <text x="780" y="331">50.47</text>
    </g>

    <line x1="92" y1="504" x2="802" y2="504" stroke="#526176" stroke-width="1.5"/>
    <g fill="#94a3b8" font-size="14" text-anchor="middle">
      <text x="100" y="534">4</text>
      <text x="213" y="534">6</text>
      <text x="327" y="534">8</text>
      <text x="440" y="534">10</text>
      <text x="553" y="534">12</text>
      <text x="780" y="534">16</text>
    </g>
    <text x="447" y="566" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="650">HBM WORKSPACE (GiB)</text>
  </g>

  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="838" y="178" width="314" height="388" rx="8" fill="#111c2e" stroke="#26364d"/>
    <text x="866" y="216" fill="#f8fafc" font-size="19" font-weight="700">Traffic falls after latency flattens</text>
    <text x="866" y="242" fill="#94a3b8" font-size="14">Planner output for the same 524K shape</text>

    <text x="866" y="286" fill="#cbd5e1" font-size="14" font-weight="650">4 GiB</text>
    <rect x="930" y="270" width="182" height="20" rx="5" fill="#223047"/>
    <rect x="930" y="270" width="182" height="20" rx="5" fill="#fb923c"/>
    <text x="1112" y="309" text-anchor="end" fill="#f8fafc" font-size="14" font-weight="650">119 GiB H2D · 8 Q passes</text>

    <text x="866" y="356" fill="#cbd5e1" font-size="14" font-weight="650">8 GiB</text>
    <rect x="930" y="340" width="182" height="20" rx="5" fill="#223047"/>
    <rect x="930" y="340" width="96" height="20" rx="5" fill="#38bdf8"/>
    <text x="1112" y="379" text-anchor="end" fill="#f8fafc" font-size="14" font-weight="650">63 GiB H2D · 4 Q passes</text>

    <text x="866" y="426" fill="#cbd5e1" font-size="14" font-weight="650">16 GiB</text>
    <rect x="930" y="410" width="182" height="20" rx="5" fill="#223047"/>
    <rect x="930" y="410" width="54" height="20" rx="5" fill="#34d399"/>
    <text x="1112" y="449" text-anchor="end" fill="#f8fafc" font-size="14" font-weight="650">35 GiB H2D · 2 Q passes</text>

    <line x1="866" y1="478" x2="1124" y2="478" stroke="#26364d"/>
    <text x="866" y="512" fill="#fb923c" font-size="24" font-weight="750">8 GiB captures the gain</text>
    <text x="866" y="538" fill="#94a3b8" font-size="14">Larger workspaces save PCIe traffic,</text>
    <text x="866" y="559" fill="#94a3b8" font-size="14">but not wall time for this workload.</text>
  </g>

  <line x1="48" y1="606" x2="1152" y2="606" stroke="#26364d"/>
  <text x="48" y="637" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13">Median of one GPU2 and one GPU3 observation per workspace · error bars show their full span · August 18, 2026</text>
  <text x="1152" y="637" text-anchor="end" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13">RTX 5090 · non-causal MHA</text>
</svg>
