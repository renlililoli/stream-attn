<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">seqattn 524K-token RTX 5090 HBM workspace sweep</title>
  <desc id="desc">Execution time reaches a plateau at 2 GiB while logical H2D traffic and query passes continue to fall as the HBM workspace grows.</desc>

  <rect width="1200" height="680" rx="8" fill="#0b1220"/>

  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="48" y="58" fill="#f8fafc" font-size="30" font-weight="700">524K-token exact dense attention</text>
    <text x="48" y="90" fill="#94a3b8" font-size="16">RTX 5090 · BF16 · 56 heads · head dim 128 · 21 GiB caller-owned Q/K/V</text>

    <rect x="48" y="116" width="248" height="42" rx="6" fill="#132033" stroke="#26364d"/>
    <text x="66" y="143" fill="#cbd5e1" font-size="14">1 GiB workspace</text>
    <text x="276" y="143" text-anchor="end" fill="#fb923c" font-size="17" font-weight="700">38.201 s</text>

    <rect x="308" y="116" width="248" height="42" rx="6" fill="#132033" stroke="#26364d"/>
    <text x="326" y="143" fill="#cbd5e1" font-size="14">2 GiB workspace</text>
    <text x="536" y="143" text-anchor="end" fill="#34d399" font-size="17" font-weight="700">36.247 s</text>

    <rect x="568" y="116" width="276" height="42" rx="6" fill="#132033" stroke="#26364d"/>
    <text x="586" y="143" fill="#cbd5e1" font-size="14">4-14 GiB time spread</text>
    <text x="824" y="143" text-anchor="end" fill="#38bdf8" font-size="17" font-weight="700">0.31%</text>

    <text x="48" y="194" fill="#e2e8f0" font-size="15" font-weight="650">EXECUTION TIME (SECONDS)</text>

    <g stroke="#26364d" stroke-width="1">
      <line x1="92" y1="220" x2="804" y2="220"/>
      <line x1="92" y1="290" x2="804" y2="290"/>
      <line x1="92" y1="360" x2="804" y2="360"/>
      <line x1="92" y1="430" x2="804" y2="430"/>
      <line x1="92" y1="500" x2="804" y2="500"/>
    </g>

    <g fill="#64748b" font-size="13" text-anchor="end">
      <text x="78" y="225">38.5</text>
      <text x="78" y="295">37.8</text>
      <text x="78" y="365">37.1</text>
      <text x="78" y="435">36.4</text>
      <text x="78" y="505">35.7</text>
    </g>

    <rect x="170" y="438" width="634" height="62" fill="#34d399" opacity="0.055"/>
    <text x="188" y="482" fill="#6ee7b7" font-size="13" font-weight="650">2-14 GiB THROUGHPUT PLATEAU</text>

    <polyline points="102,250 202,475 302,492 402,487 502,488 602,489 702,495 802,499" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#0b1220" stroke-width="3">
      <circle cx="102" cy="250" r="7" fill="#fb923c"/>
      <circle cx="202" cy="475" r="7" fill="#34d399"/>
      <circle cx="302" cy="492" r="6" fill="#38bdf8"/>
      <circle cx="402" cy="487" r="6" fill="#38bdf8"/>
      <circle cx="502" cy="488" r="6" fill="#38bdf8"/>
      <circle cx="602" cy="489" r="6" fill="#38bdf8"/>
      <circle cx="702" cy="495" r="6" fill="#38bdf8"/>
      <circle cx="802" cy="499" r="6" fill="#38bdf8"/>
    </g>

    <g fill="#f8fafc" font-size="13" font-weight="650" text-anchor="middle">
      <text x="102" y="232">38.201</text>
      <text x="202" y="455">36.247</text>
      <text x="302" y="525">36.073</text>
      <text x="402" y="467">36.122</text>
      <text x="502" y="525">36.113</text>
      <text x="602" y="469">36.111</text>
      <text x="702" y="528">36.053</text>
      <text x="802" y="479">36.010</text>
    </g>

    <line x1="92" y1="540" x2="804" y2="540" stroke="#526176" stroke-width="1.5"/>
    <g fill="#94a3b8" font-size="14" text-anchor="middle">
      <text x="102" y="566">1</text>
      <text x="202" y="566">2</text>
      <text x="302" y="566">4</text>
      <text x="402" y="566">6</text>
      <text x="502" y="566">8</text>
      <text x="602" y="566">10</text>
      <text x="702" y="566">12</text>
      <text x="802" y="566">14</text>
    </g>
    <text x="448" y="594" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="650">HBM WORKSPACE (GiB)</text>

    <rect x="840" y="178" width="312" height="416" rx="8" fill="#111c2e" stroke="#26364d"/>
    <text x="868" y="216" fill="#f8fafc" font-size="19" font-weight="700">Traffic keeps falling</text>
    <text x="868" y="242" fill="#94a3b8" font-size="14">Logical H2D · query passes</text>

    <g font-size="14">
      <text x="868" y="286" fill="#cbd5e1" font-weight="650">1 GiB</text>
      <rect x="930" y="270" width="182" height="18" rx="4" fill="#fb923c"/>
      <text x="1112" y="309" text-anchor="end" fill="#f8fafc" font-weight="650">763 GiB · 54 passes</text>

      <text x="868" y="352" fill="#cbd5e1" font-weight="650">2 GiB</text>
      <rect x="930" y="336" width="182" height="18" rx="4" fill="#223047"/>
      <rect x="930" y="336" width="65" height="18" rx="4" fill="#34d399"/>
      <text x="1112" y="375" text-anchor="end" fill="#f8fafc" font-weight="650">273 GiB · 19 passes</text>

      <text x="868" y="418" fill="#cbd5e1" font-weight="650">4 GiB</text>
      <rect x="930" y="402" width="182" height="18" rx="4" fill="#223047"/>
      <rect x="930" y="402" width="29" height="18" rx="4" fill="#38bdf8"/>
      <text x="1112" y="441" text-anchor="end" fill="#f8fafc" font-weight="650">119 GiB · 8 passes</text>

      <text x="868" y="484" fill="#cbd5e1" font-weight="650">8 GiB</text>
      <rect x="930" y="468" width="182" height="18" rx="4" fill="#223047"/>
      <rect x="930" y="468" width="15" height="18" rx="4" fill="#38bdf8"/>
      <text x="1112" y="507" text-anchor="end" fill="#f8fafc" font-weight="650">63 GiB · 4 passes</text>

      <text x="868" y="550" fill="#cbd5e1" font-weight="650">14 GiB</text>
      <rect x="930" y="534" width="182" height="18" rx="4" fill="#223047"/>
      <rect x="930" y="534" width="12" height="18" rx="4" fill="#38bdf8"/>
      <text x="1112" y="573" text-anchor="end" fill="#f8fafc" font-weight="650">49 GiB · 3 passes</text>
    </g>

    <line x1="48" y1="622" x2="1152" y2="622" stroke="#26364d"/>
    <text x="48" y="651" fill="#64748b" font-size="13">One observation per point · physical GPU3 · no concurrent SeqAttn scan</text>
    <text x="1152" y="651" text-anchor="end" fill="#64748b" font-size="13">RTX 5090 · non-causal BF16 MHA · August 19, 2026</text>
  </g>
</svg>
