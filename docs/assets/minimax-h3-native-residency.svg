<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Native MiniMax-H3 memory residency during denoising</title>
  <desc id="desc">CPU DRAM stores offloaded model weights while GPU HBM stores the active DiT working set and full-sequence activations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#12182d"/></linearGradient>
    <linearGradient id="cpu" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#164e63"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="56" y="62" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="29" font-weight="700">Native DiffSynth · memory residency during the 132K-token DiT loop</text>
  <text x="56" y="96" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="16">NF4 checkpoint · BF16 compute · CPU weight offload · no disk offload</text>

  <g filter="url(#shadow)">
    <rect x="56" y="130" width="500" height="450" rx="24" fill="url(#cpu)" stroke="#3b82f6" stroke-opacity=".45"/>
    <circle cx="92" cy="171" r="17" fill="#60a5fa" opacity=".2"/>
    <path d="M83 168h18v12H83zm3-7h12v7H86z" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <text x="124" y="179" fill="#dbeafe" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="700">CPU DRAM · backing store</text>

    <rect x="84" y="211" width="444" height="62" rx="14" fill="#0f1f46"/>
    <text x="106" y="238" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="650">Inactive model weights</text>
    <text x="106" y="260" fill="#93c5fd" font-family="Inter,Segoe UI,sans-serif" font-size="14">Text encoder, Video VAE, Audio VAE during denoising</text>

    <rect x="84" y="289" width="444" height="76" rx="14" fill="#0f1f46"/>
    <text x="106" y="317" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="650">Offloaded DiT NF4 weights</text>
    <text x="106" y="340" fill="#93c5fd" font-family="Inter,Segoe UI,sans-serif" font-size="14">Layers not currently prepared/resident on GPU</text>
    <text x="106" y="359" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13">Copied/rebuilt for computation as wrappers execute</text>

    <rect x="84" y="381" width="444" height="76" rx="14" fill="#0f1f46"/>
    <text x="106" y="409" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="650">Host-side inputs and runtime state</text>
    <text x="106" y="432" fill="#93c5fd" font-family="Inter,Segoe UI,sans-serif" font-size="14">Checkpoint backing, prompt-side data, Python objects</text>
    <text x="106" y="451" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13">CPU RSS peak in native run: 32,766 MiB</text>

    <rect x="84" y="473" width="444" height="78" rx="14" fill="#17223e" stroke="#60a5fa" stroke-opacity=".25"/>
    <text x="106" y="501" fill="#bfdbfe" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="650">Not disk offload</text>
    <text x="106" y="526" fill="#93c5fd" font-family="Inter,Segoe UI,sans-serif" font-size="14">The complete experiment uses CPU/DRAM as weight backing.</text>
  </g>

  <path d="M568 326h52" stroke="#67e8f9" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M610 317l12 9-12 9" fill="none" stroke="#67e8f9" stroke-width="3"/>
  <text x="570" y="303" fill="#67e8f9" font-family="Inter,Segoe UI,sans-serif" font-size="13">per-layer transfer</text>

  <g filter="url(#shadow)">
    <rect x="634" y="130" width="510" height="450" rx="24" fill="url(#gpu)" stroke="#2dd4bf" stroke-opacity=".55"/>
    <circle cx="670" cy="171" r="17" fill="#2dd4bf" opacity=".2"/>
    <rect x="661" y="162" width="18" height="18" rx="3" fill="none" stroke="#99f6e4" stroke-width="2"/>
    <path d="M665 158v4m6-4v4m6-4v4m-12 18v4m6-4v4m6-4v4m-20-14h4m-4 7h4m18-7h4m-4 7h4" stroke="#99f6e4" stroke-width="2"/>
    <text x="702" y="179" fill="#ccfbf1" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="700">GPU HBM · active working set</text>

    <rect x="662" y="211" width="454" height="68" rx="14" fill="#082f3e"/>
    <text x="684" y="238" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="650">Prepared/current DiT weights</text>
    <text x="684" y="260" fill="#99f6e4" font-family="Inter,Segoe UI,sans-serif" font-size="14">Observed named DiT CUDA storage: 1,030.8 MiB at step end</text>

    <rect x="662" y="295" width="454" height="122" rx="14" fill="#082f3e"/>
    <text x="684" y="323" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="650">Complete sequence activations</text>
    <text x="684" y="347" fill="#99f6e4" font-family="Inter,Segoe UI,sans-serif" font-size="14">hidden/residual 1.325 GiB · QKV 5.299 GiB</text>
    <text x="684" y="370" fill="#99f6e4" font-family="Inter,Segoe UI,sans-serif" font-size="14">attention output 1.766 GiB · fc1 output 7.065 GiB</text>
    <text x="684" y="393" fill="#fbbf24" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="650">gate/up/product: 3.532 GiB each</text>

    <rect x="662" y="433" width="454" height="118" rx="14" fill="#082f3e"/>
    <text x="684" y="461" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="650">Runtime overhead</text>
    <text x="684" y="485" fill="#99f6e4" font-family="Inter,Segoe UI,sans-serif" font-size="14">FlashAttention workspace · CUDA context · temporary casts</text>
    <text x="684" y="508" fill="#99f6e4" font-family="Inter,Segoe UI,sans-serif" font-size="14">Torch allocator reserved/cache: 30,254 MiB at step 14</text>
    <text x="684" y="531" fill="#fca5a5" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="650">Step 15 fails requesting another 3.53 GiB MLP tensor</text>
  </g>

  <rect x="56" y="612" width="1088" height="62" rx="18" fill="#0d182b" stroke="#23324e"/>
  <text x="80" y="638" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="650">Model timeline:</text>
  <text x="205" y="638" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="15">Text encoder</text>
  <path d="M300 633h55" stroke="#475569" stroke-width="2"/><path d="M347 627l9 6-9 6" fill="#475569"/>
  <text x="374" y="638" fill="#67e8f9" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">DiT × 50 steps</text>
  <path d="M500 633h55" stroke="#475569" stroke-width="2"/><path d="M547 627l9 6-9 6" fill="#475569"/>
  <text x="574" y="638" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="15">Video VAE</text>
  <path d="M665 633h55" stroke="#475569" stroke-width="2"/><path d="M712 627l9 6-9 6" fill="#475569"/>
  <text x="739" y="638" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="15">Audio VAE</text>
  <text x="80" y="660" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13">Only the active model is onloaded; the encoder and both decoders are not co-resident with DiT during denoising.</text>
</svg>
