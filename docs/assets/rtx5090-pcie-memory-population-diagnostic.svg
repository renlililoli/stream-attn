<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">RTX 5090 PCIe bandwidth is limited by sparse host-memory population</title>
  <desc id="desc">Single populated NUMA memory nodes supply about 37 gigabytes per second. Interleaving pinned pages across two populated nodes reaches 56.76 gigabytes per second, close to the encoded PCIe 5.0 x16 line rate.</desc>
  <rect width="1200" height="500" fill="#0b1020"/>
  <text x="64" y="58" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700">37 GB/s is the host-memory roof, not the PCIe 5.0 x16 roof</text>
  <text x="64" y="91" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="16">RTX 5090 · exact 112 MiB BF16 K/V payload · 50 samples · idle physical GPU2</text>

  <line x1="330" y1="128" x2="330" y2="408" stroke="#475569" stroke-width="1"/>
  <line x1="330" y1="408" x2="1120" y2="408" stroke="#475569" stroke-width="1"/>
  <g fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle">
    <text x="330" y="432">0</text>
    <text x="455" y="432">10</text>
    <text x="581" y="432">20</text>
    <text x="706" y="432">30</text>
    <text x="832" y="432">40</text>
    <text x="957" y="432">50</text>
    <text x="1083" y="432">60 GB/s</text>
  </g>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="455" y1="128" x2="455" y2="408"/>
    <line x1="581" y1="128" x2="581" y2="408"/>
    <line x1="706" y1="128" x2="706" y2="408"/>
    <line x1="832" y1="128" x2="832" y2="408"/>
    <line x1="957" y1="128" x2="957" y2="408"/>
    <line x1="1083" y1="128" x2="1083" y2="408"/>
  </g>

  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="64" y="176" fill="#cbd5e1" font-size="17">Pinned on node5</text>
    <text x="64" y="198" fill="#64748b" font-size="13">one populated DDR5 channel</text>
    <rect x="330" y="153" width="453.6" height="54" rx="4" fill="#38bdf8"/>
    <text x="802" y="187" fill="#e0f2fe" font-size="18" font-weight="700">36.14</text>

    <text x="64" y="270" fill="#cbd5e1" font-size="17">Pinned on node7</text>
    <text x="64" y="292" fill="#64748b" font-size="13">one populated DDR5 channel</text>
    <rect x="330" y="247" width="463.4" height="54" rx="4" fill="#22c55e"/>
    <text x="812" y="281" fill="#dcfce7" font-size="18" font-weight="700">36.92</text>

    <text x="64" y="364" fill="#cbd5e1" font-size="17">Interleave node5 + node7</text>
    <text x="64" y="386" fill="#64748b" font-size="13">two populated DDR5 channels</text>
    <rect x="330" y="341" width="712.4" height="54" rx="4" fill="#f59e0b"/>
    <text x="1061" y="375" fill="#fef3c7" font-size="18" font-weight="700">56.76</text>
  </g>

  <line x1="1120" y1="128" x2="1120" y2="408" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1110" y="119" fill="#fca5a5" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="end">PCIe 5.0 x16 encoded: 63.02 GB/s</text>
  <text x="64" y="470" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="15">Two-node interleaving adds 53.7% bandwidth and reaches 90.1% of the encoded link rate.</text>
</svg>
