  <text x="48" y="58" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="700">A30 400K-token exact dense attention</text>
  <text x="48" y="90" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="17">NVIDIA A30 24GiB · 409,600 tokens · MHA 56/56/56 · BF16 · non-causal · single GPU · log axes</text>
