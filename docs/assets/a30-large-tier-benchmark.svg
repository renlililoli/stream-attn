  <text x="48" y="58" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="700">A30 400K-token exact dense attention</text>
  <text x="48" y="90" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="17">NVIDIA A30 24GiB · 409,600 tokens · BF16 MHA 56/56/56 · 64x64 / 4 warps / 1 stage · log axes</text>
