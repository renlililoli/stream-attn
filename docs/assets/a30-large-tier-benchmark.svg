<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">seqattn A30 400K-token HBM workspace benchmark</title>
  <desc id="desc">Execution is flat at 106s for 1-2 GiB workspaces, rises 4.6% to 111s at 16 GiB, and collapses to 681s at 0.5 GiB where 7.6 TiB of H2D makes the operator PCIe-bound. Both axes are logarithmic.</desc>
