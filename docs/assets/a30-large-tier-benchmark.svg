<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">seqattn A30 400K-token HBM workspace benchmark</title>
  <desc id="desc">Execution time rises monotonically from 106.3s at a 2 GiB workspace to 111.2s at 16 GiB on the A30 while H2D traffic falls from 170 GiB to 27 GiB; the operator is compute-bound on this GPU.</desc>
  <rect width="1200" height="680" rx="8" fill="#0b1220"/>
  <text x="48" y="58" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="700">A30 400K-token exact dense attention</text>
  <text x="48" y="90" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="17">NVIDIA A30 24GiB · 409,600 tokens · MHA 56/56/56 · BF16 · non-causal · single GPU</text>
  <line x1="150" y1="560" x2="1090" y2="560" stroke="#26364d" stroke-width="1"/>
  <text x="138" y="564" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="end">106 s</text>
  <line x1="150" y1="487" x2="1090" y2="487" stroke="#26364d" stroke-width="1"/>
  <text x="138" y="491" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="end">107 s</text>
  <line x1="150" y1="413" x2="1090" y2="413" stroke="#26364d" stroke-width="1"/>
  <text x="138" y="417" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="end">108 s</text>
  <line x1="150" y1="340" x2="1090" y2="340" stroke="#26364d" stroke-width="1"/>
  <text x="138" y="344" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="end">109 s</text>
  <line x1="150" y1="267" x2="1090" y2="267" stroke="#26364d" stroke-width="1"/>
  <text x="138" y="271" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="end">110 s</text>
  <line x1="150" y1="193" x2="1090" y2="193" stroke="#26364d" stroke-width="1"/>
  <text x="138" y="197" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="end">111 s</text>
  <line x1="150" y1="120" x2="1090" y2="120" stroke="#26364d" stroke-width="1"/>
  <text x="138" y="124" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="end">112 s</text>
  <line x1="150" y1="560" x2="150" y2="566" stroke="#26364d" stroke-width="1"/>
  <text x="150" y="584" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle">2 GiB</text>
  <line x1="284" y1="560" x2="284" y2="566" stroke="#26364d" stroke-width="1"/>
  <text x="284" y="584" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle">4 GiB</text>
  <line x1="419" y1="560" x2="419" y2="566" stroke="#26364d" stroke-width="1"/>
  <text x="419" y="584" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle">6 GiB</text>
  <line x1="553" y1="560" x2="553" y2="566" stroke="#26364d" stroke-width="1"/>
  <text x="553" y="584" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle">8 GiB</text>
  <line x1="687" y1="560" x2="687" y2="566" stroke="#26364d" stroke-width="1"/>
  <text x="687" y="584" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle">10 GiB</text>
  <line x1="821" y1="560" x2="821" y2="566" stroke="#26364d" stroke-width="1"/>
  <text x="821" y="584" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle">12 GiB</text>
  <line x1="956" y1="560" x2="956" y2="566" stroke="#26364d" stroke-width="1"/>
  <text x="956" y="584" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle">14 GiB</text>
  <line x1="1090" y1="560" x2="1090" y2="566" stroke="#26364d" stroke-width="1"/>
  <text x="1090" y="584" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle">16 GiB</text>
  <text x="1090" y="604" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="14" text-anchor="end">HBM workspace</text>
  <text x="150" y="80" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="14">Execution (seconds)</text>
