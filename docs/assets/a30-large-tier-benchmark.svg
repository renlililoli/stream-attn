<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">seqattn A30 400K-token optimized HBM workspace benchmark</title>
  <desc id="desc">The optimized Ampere profile reaches 102.319 seconds at 1 GiB and remains between 105.233 and 109.078 seconds from 2 to 16 GiB. At 0.5 GiB, 7.61 TiB of logical H2D traffic makes the operator PCIe-bound and execution takes 681.162 seconds. Both axes are logarithmic.</desc>
