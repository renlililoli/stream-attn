  <text x="575" y="468" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="14">1 GiB is fastest · 3.90% faster than the previous kernel · 0.5 GiB remains PCIe-bound</text>
  <text x="575" y="488" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="13">FlashAttention 2 reference: 50.827 s (2026-08-18) · optimized streaming is 2.01-2.15x at 1-16 GiB</text>
