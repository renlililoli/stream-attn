  <circle cx="150" cy="148" r="4" fill="#fb923c"/>
  <circle cx="284" cy="390" r="4" fill="#fb923c"/>
  <circle cx="419" cy="480" r="4" fill="#fb923c"/>
  <circle cx="553" cy="510" r="4" fill="#fb923c"/>
  <circle cx="821" cy="541" r="4" fill="#fb923c"/>
  <circle cx="1090" cy="541" r="4" fill="#fb923c"/>
  <text x="1102" y="564" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13">20 GiB</text>
  <text x="1102" y="454" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13">60 GiB</text>
  <text x="1102" y="344" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13">100 GiB</text>
  <text x="1102" y="234" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13">140 GiB</text>
  <text x="1102" y="124" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13">180 GiB</text>
  <text x="1102" y="80" fill="#fb923c" font-family="Inter,Segoe UI,sans-serif" font-size="14">H2D traffic</text>
  <path d="M150,539 L284,431 L419,389 L553,291 L821,200 L1090,181" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="150" cy="539" r="5" fill="#38bdf8"/>
  <text x="150" y="527" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle">106.3s</text>
  <circle cx="284" cy="431" r="5" fill="#38bdf8"/>
  <text x="284" y="419" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle">107.8s</text>
  <circle cx="419" cy="389" r="5" fill="#38bdf8"/>
  <text x="419" y="377" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle">108.3s</text>
  <circle cx="553" cy="291" r="5" fill="#38bdf8"/>
  <text x="553" y="279" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle">109.7s</text>
  <circle cx="821" cy="200" r="5" fill="#38bdf8"/>
  <text x="821" y="188" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle">110.9s</text>
  <circle cx="1090" cy="181" r="5" fill="#38bdf8"/>
  <text x="1090" y="169" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle">111.2s</text>
  <rect x="480" y="458" width="500" height="52" rx="6" fill="#132033"/>
  <text x="486" y="480" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="14">Compute-bound: 2 GiB is fastest, 2→16 GiB adds +4.6% wall time</text>
  <text x="486" y="500" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="13">GPU-resident FlashAttention 2 baseline: 50.827 s (94.6 TFLOPS) — sweep is 2.09-2.19x</text>
</svg>