  <text x="575" y="468" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="14">1-2 GiB sweet spot (compute-bound) · 0.5 GiB cliff: 7.6 TiB H2D (PCIe-bound)</text>
  <text x="575" y="488" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="13">GPU-resident FlashAttention 2 baseline: 50.827 s (94.6 TFLOPS) — sweep is 2.09-2.19x in the feasible region</text>
